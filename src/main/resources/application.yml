spring:
  application:
    name: itsec-test

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsectest}
    username: ${DB_USERNAME:itsectest}
    password: ${DB_PASSWORD:itsectest}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  max-http-request-header-size: 32KB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-development-only-secret-key}
    issuer: ${JWT_ISSUER:https://itsec-test.local}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  mfa:
    enabled: ${MFA_ENABLED:true}
    otp-length: 6
    otp-ttl: 5m
    max-verify-attempts: 3
    resend-cooldown: 60s
  lockout:
    max-attempts: 5
    window: 10m
    duration: 30m
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-limit: 100
    default-window: 1m
    rules:
      - pattern: /api/v1/auth/login
        methods: [POST]
        limit: 5
        window: 1m
      - pattern: /api/v1/auth/mfa/verify
        methods: [POST]
        limit: 10
        window: 1m
      - pattern: /api/v1/auth/mfa/resend
        methods: [POST]
        limit: 3
        window: 1m
      - pattern: /api/v1/auth/register
        methods: [POST]
        limit: 10
        window: 1h
  cache:
    article-ttl: 10m
  mail:
    from: ${MAIL_FROM:no-reply@itsec-test.local}
    delivery-enabled: ${MAIL_DELIVERY_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    com.itsectest: ${LOG_LEVEL:INFO}
