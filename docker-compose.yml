services:
  postgres:
    image: postgres:16-alpine
    container_name: itsec-test-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-itsectest}
      POSTGRES_USER: ${DB_USERNAME:-itsectest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itsectest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-itsectest} -d ${DB_NAME:-itsectest}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: itsec-test-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: itsec-test-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-itsectest}
      DB_USERNAME: ${DB_USERNAME:-itsectest}
      DB_PASSWORD: ${DB_PASSWORD:-itsectest}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-this-in-any-real-environment}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@itsec-test.local}
      MAIL_DELIVERY_ENABLED: ${MAIL_DELIVERY_ENABLED:-true}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
  redis-data:
